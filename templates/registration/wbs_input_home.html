
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>WBS 입력 모달 예제</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 40px; background: #f8f8f8; }
        table { width: 100%; border-collapse: collapse; margin-top: 30px; background-color: white; }
        th, td { border: 1px solid #ccc; padding: 10px; text-align: center; }
        th { background-color: #d4e4ff; }
        input, select, textarea { width: 100%; padding: 4px; font-size: 13px; }
        .btn { padding: 5px 10px; margin: 2px; cursor: pointer; }
    </style>
</head>
<body>
    <h3>📋 기존 WBS 항목</h3>
    <button onclick="openModal()" class="btn">+ 새 항목 추가</button>

    <!-- 모달 입력창 -->
    <div id="inputModal" style="display:none; position:fixed; inset:0; background-color:rgba(0,0,0,0.5); z-index:999; align-items:center; justify-content:center; display:flex;">
        <div style="background:white; width:600px; padding:20px; border-radius:8px; position:relative;">
            <h3>📝 새 WBS 항목 추가</h3>
            <table style="width:100%">
                <tr><td>TASK TITLE</td><td><input type="text" id="new_task_title"></td></tr>
                <tr><td>TASK OWNER</td><td><input type="text" id="new_task_owner"></td></tr>
                <tr><td>Device</td><td><input type="text" id="new_device"></td></tr>
                <tr><td>START DATE</td><td><input type="date" id="new_start_date"></td></tr>
                <tr><td>DUE DATE</td><td><input type="date" id="new_due_date"></td></tr>
                <tr><td>Tester</td><td><input type="text" id="new_tester"></td></tr>
                <tr><td>DURATION</td><td><input type="number" id="new_duration" min="0"></td></tr>
                <tr><td>PROGRESS</td><td>
                    <select id="new_progress">
                        <option>Wait</option>
                        <option>In progress</option>
                        <option>COMPLETE</option>
                        <option>Hold</option>
                    </select>
                </td></tr>
                <tr><td>Comment</td><td><textarea id="new_comment"></textarea></td></tr>
            </table>
            <div style="text-align:right; margin-top:20px;">
                <button class="btn" onclick="addRow()">추가</button>
                <button class="btn" onclick="closeModal()">닫기</button>
            </div>
        </div>
    </div>

    <table>
        <thead>
            <tr>
                <th>No.</th><th>TASK TITLE</th><th>TASK OWNER</th><th>Device</th>
                <th>START DATE</th><th>DUE DATE</th><th>Tester</th><th>DURATION</th><th>PROGRESS</th><th>Comment</th><th>Action</th>
            </tr>
        </thead>
        <tbody id="wbsTableBody">
            <tr id="row1">
                <td>1</td><td>Flip7 GFP Compile Log 확보 요청</td><td>곽한호</td><td>Solomon - 32</td>
                <td>2025-06-17</td><td>2025-06-19</td><td>이수연</td><td>2</td><td>In progress</td><td>-</td>
                <td><button class="btn" onclick="editRow(1)">수정</button></td>
            </tr>
        </tbody>
    </table>

    <script>
        let currentRowCount = 1;
        function openModal() {
            document.getElementById('inputModal').style.display = 'flex';
        }
        function closeModal() {
            document.getElementById('inputModal').style.display = 'none';
        }
        function addRow() {
            currentRowCount++;
            const tbody = document.getElementById('wbsTableBody');
            const row = document.createElement('tr');
            row.id = `row${currentRowCount}`;
            const values = ['new_task_title','new_task_owner','new_device','new_start_date','new_due_date','new_tester','new_duration','new_progress','new_comment']
                .map(id => document.getElementById(id).value);
            row.innerHTML = `
                <td>${currentRowCount}</td>
                ${values.slice(0,8).map(val => `<td>${val}</td>`).join('')}
                <td>${values[8]}</td>
                <td><button class="btn" onclick="editRow(${currentRowCount})">수정</button></td>
            `;
            tbody.appendChild(row);
            closeModal();
        }
        function editRow(id) {
            alert("수정 기능은 향후에 제공됩니다.");
        }
    </script>
</body>
</html>
