<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>WBS 입력</title>
    <style>
        * {margin: 0; padding: 0; }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: url(login.jpg) no-repeat center;
            background-size: 100% 100%;
            flex-direction: column;
        }

        table.voc_table {
            width: 95%;
            border-collapse: collapse;
            background-color: white;
            margin-top: 50px;
        }

        .voc_table th, .voc_table td {
            border: 1px solid #ddd;
            padding: 8px;
        }

        .voc_table th {
            background-color: #f2f2f2;
        }

        .voc_table input,
        .voc_table select,
        .voc_table textarea {
            width: 100%;
            padding: 4px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <form method="post" action="/voc/submit/">
        <table class="voc_table">
            <thead>
                <tr>
                    <th>No.</th>
                    <th>TASK TITLE</th>
                    <th>TASK OWNER</th>
                    <th>Device</th>
                    <th>START DATE</th>
                    <th>DUE DATE</th>
                    <th>Tester</th>
                    <th>DURATION</th>
                    <th>PROGRESS</th>
                    <th>Comment</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>1</td>
                    <td><input type="text" name="task_title"></td>
                    <td><input type="text" name="task_owner"></td>
                    <td><input type="text" name="device"></td>
                    <td><input type="date" name="start_date"></td>
                    <td><input type="date" name="due_date"></td>
                    <td><input type="text" name="tester"></td>
                    <td><input type="number" name="duration" min="0"></td>
                    <td>
                        <select name="progress">
                            <option value="Wait">Wait</option>
                            <option value="In progress">In progress</option>
                            <option value="COMPLETE">COMPLETE</option>
                            <option value="Hold">Hold</option>
                        </select>
                    </td>
                    <td><textarea name="comment"></textarea></td>
                </tr>
            </tbody>
        </table>
        <div style="margin-top: 20px; text-align: center;">
            <button type="submit">제출</button>
        </div>
    </form>
</body>
</html>
